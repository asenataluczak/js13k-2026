<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>js13k</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div style="display: flex">
      <canvas width="600" height="600"></canvas>
      <div style="margin-top: 40px">
        <div class="box">
          <div class="box-color red"></div>
          <div>manual bullets (default)</div>
        </div>
        <div class="box">
          <div class="box-color orange"></div>
          <div>turrets (1/1)</div>
        </div>
        <div class="box">
          <div class="box-color yellow"></div>
          <div>turret bigger radius / turret faster bullets</div>
        </div>
        <div class="box">
          <div class="box-color green"></div>
          <div>-</div>
        </div>
        <div class="box">
          <div class="box-color blue"></div>
          <div>-</div>
        </div>
        <div class="box">
          <div class="box-color dark-purple"></div>
          <div>-</div>
        </div>
        <div class="box">
          <div class="box-color purple"></div>
          <div>-</div>
        </div>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
